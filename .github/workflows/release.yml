name: Release - Publish EXE to Public Repo

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake (x64 Release)
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64

      - name: Build EXE
        run: cmake --build build-ci --config Release --parallel

      - name: Prepare release package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $pkg = "dist/NetworkManager"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "build-ci/release/PcPosNetworkManager.exe" "$pkg/NetworkManager.exe"
          Copy-Item "config.example.ini" "$pkg/config.ini"
          Copy-Item "README.md" "$pkg/README.md"
          New-Item -ItemType Directory -Force -Path "$pkg/logs" | Out-Null
          Compress-Archive -Path "$pkg/*" -DestinationPath "dist/NetworkManager-$ver-Windows-x64.zip"

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          Move-Item "Output/NetworkManager-Setup.exe" "dist/NetworkManager-Setup.exe"

      - name: Create GitHub Release (private repo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Network Manager ${{ github.ref_name }}"
          body: |
            ## Network Manager ${{ github.ref_name }}
            Windows x64 kurulum paketi ve tasinabilir surum olusturuldu.
          files: |
            dist/NetworkManager-${{ github.ref_name }}-Windows-x64.zip
            dist/NetworkManager-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish EXE to Public Releases Repo
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_TOKEN }}
          repository: ${{ github.repository_owner }}/Network-Manager-Releases
          tag_name: ${{ github.ref_name }}
          name: "Network Manager ${{ github.ref_name }}"
          body: |
            ## Network Manager Windows Surumu (${{ github.ref_name }})
            PC ile POS cihazi arasindaki yerel ag iletisimini kararli tutmak icin hazirlanmis ag profil yoneticisi.
          files: |
            dist/NetworkManager-${{ github.ref_name }}-Windows-x64.zip
            dist/NetworkManager-Setup.exe
          draft: false
          prerelease: false
